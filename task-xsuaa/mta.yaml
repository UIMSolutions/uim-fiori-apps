_schema-version: '3.2'
ID: taskmanager-xsuaa-mta
version: 1.0.0
description: "MTA Deployment for vibe.d Dlang App with XSUAA and Approuter"
modules:
# --------------------- VIBE.D BACKEND MODULE ---------------------
- name: taskmanager-xsuaa-backend
  type: binary
  path: backend
  parameters:
    stack: cflinuxfs5
    buildpack: binary_buildpack
    command: ./taskmanager-xsuaa
    memory: 128M
    disk-quota: 256M
  provides:
  - name: vibe-backend-api
    properties:
      url: ${default-url}
# ----------------------- APPROUTER MODULE -----------------------
- name: taskmanager-xsuaa-approuter
  type: nodejs
  path: approuter
  parameters:
    buildpack: nodejs_buildpack
    memory: 128M
    disk-quota: 256M
  requires:
  - name: taskmanager-xsuaa
  - name: vibe-backend-api
    group: destinations
    properties:
      name: vibe-backend-dest
      url: ~{url}
      forwardAuthToken: true
resources:
# ----------------------- XSUAA SERVICE -----------------------
- name: taskmanager-xsuaa
  type: org.cloudfoundry.managed-service
  parameters:
    service: xsuaa
    service-plan: application
    path: ./xs-security.json
