apiVersion: apps/v1
kind: Deployment
metadata:
  name: landscape-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landscape-frontend
  template:
    metadata:
      labels:
        app: landscape-frontend
    spec:
      containers:
      - name: landscape-frontend
        image: your-registry/landscape-frontend:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: landscape-frontend
spec:
  selector:
    app: landscape-frontend
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
