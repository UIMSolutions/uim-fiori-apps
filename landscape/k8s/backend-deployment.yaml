apiVersion: apps/v1
kind: Deployment
metadata:
  name: landscape-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landscape-backend
  template:
    metadata:
      labels:
        app: landscape-backend
    spec:
      containers:
      - name: landscape-backend
        image: your-registry/landscape-backend:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /odata/v4/landscape-service/
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /odata/v4/landscape-service/
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: landscape-backend
spec:
  selector:
    app: landscape-backend
  ports:
  - name: http
    port: 8081
    targetPort: 8081
  type: ClusterIP
