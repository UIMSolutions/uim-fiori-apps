<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Architecture Management</title>

    <!-- SAPUI5 Bootstrap -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m, sap.f"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-resourceroots='{
            "ea.architecture.manager": "./"
        }'>
    </script>

    <script>
        sap.ui.getCore().attachInit(function () {
            // Instanziiere den ComponentContainer und binde die Component.js ein
            new sap.ui.core.ComponentContainer({
                name: "ea.architecture.manager",
                settings: {
                    id: "eaArchitectureManager"
                },
                async: true,
                height: "100%"
            }).placeAt("content");
        });
    </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
