specVersion: "3.0"
metadata:
  name: admin-client-ui5
type: application
framework:
  name: OpenUI5
  version: "1.136.0"
  libraries:
  - name: sap.m
  - name: sap.ui.core
  - name: sap.ui.layout
server:
  customMiddleware:
  - name: ui5-middleware-simpleproxy
    mountPath: /odata
    afterMiddleware: compression
    configuration:
      baseUri: "http://localhost:8080/odata"
